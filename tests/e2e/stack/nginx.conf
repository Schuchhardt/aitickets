# Gateway del stack local de e2e: lo que hace Kong en Supabase (rutas /auth/v1 y /rest/v1 sin el prefijo).
server {
  listen 80;
  client_max_body_size 20m;

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }

  location / {
    return 404;
  }
}
