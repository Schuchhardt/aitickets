# Stack local de Supabase para los e2e con base real (tests/e2e/stack). Mismas imágenes que usa el CLI de Supabase:
# Postgres de Supabase (la versión de producción, 15.8), Auth (GoTrue) y PostgREST, con un nginx como gateway en
# 127.0.0.1:54321 (/auth/v1 y /rest/v1, como supabase-js espera). Todo desechable: NUNCA apunta a producción.
# Lo levanta tests/e2e/stack/setup.mjs, que además aplica db/schema.sql + db/migrations.
name: aitickets-e2e

# Secretos generados en cada stack por setup.mjs (guardados en .stack.env, ignorado por git): ninguno queda en el repo.
x-jwt: &jwt_secret ${E2E_JWT_SECRET:?corre node tests/e2e/stack/setup.mjs}

services:
  db:
    image: public.ecr.aws/supabase/postgres:15.8.1.085
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c log_min_messages=fatal
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?corre node tests/e2e/stack/setup.mjs}
      JWT_SECRET: *jwt_secret
    volumes:
      - ./roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    ports:
      - "127.0.0.1:54322:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 2s
      timeout: 5s
      retries: 60

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.180.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${E2E_DB_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${E2E_SITE_URL:-http://127.0.0.1:4330}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: *jwt_secret
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
      GOTRUE_LOG_LEVEL: warn

  rest:
    image: public.ecr.aws/supabase/postgrest:v12.2.12
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${E2E_DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: *jwt_secret
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: *jwt_secret
      PGRST_APP_SETTINGS_JWT_EXP: "3600"

  gateway:
    image: nginx:1.27-alpine
    depends_on: [auth, rest]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:54321:80"
