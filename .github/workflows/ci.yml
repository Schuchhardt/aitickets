name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# E2E (Playwright): el job `e2e` corre en modo SIN BD contra un servidor local (`astro dev` en 127.0.0.1,
# levantado por playwright.config.ts con SUPABASE_URL apuntando a un puerto cerrado y todas las
# integraciones apagadas). Nunca contra deploy previews ni producción (comparten la BD de producción) y
# sin secretos: los specs que necesitan BD (tests/e2e/env.ts, HAS_DB) se omiten. No se usa `astro preview`: el
# adaptador de Netlify no lo soporta. tests/e2e/global-setup.ts precalienta Vite (evita recargas a mitad de test). El modo con BD
# (E2E_DB=1) solo se corre en local y playwright.config.ts lo rechaza con CI=true.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valores ficticios: el build no debe conectarse a nada real.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role
      SITE_URL: https://aitickets.cl
      INTERNAL_API_SECRET: ci-dummy-internal-secret
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      FLOW_API_KEY: ci-dummy
      FLOW_SECRET_KEY: ci-dummy
      FLOW_BASE_URL: https://sandbox.flow.cl/api
      OUTREACH_ENABLED: 'false'
      OUTREACH_DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: astro check
        run: npm run check
        continue-on-error: true
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          # Base desechable solo para CI: sin contraseña (autenticación trust)
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      SUPABASE_DB_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint de migraciones (solo objetos de AI Tickets)
        run: npm run db:lint
      - name: Base desde el repo (stubs de Supabase + db/schema.sql + organización 1 + migraciones, primera pasada)
        run: scripts/db-ci-setup.sh
      - name: Aplicar migraciones (segunda pasada, debe aplicar 0)
        run: |
          node scripts/migrate.mjs --no-baseline | tee second-run.log
          grep -q "0 pendientes" second-run.log
          node scripts/migrate.mjs --status --fail-on-pending
      - name: Eventos demo sembrados (stand-up, concierto, feria, gratis, gira y teatro)
        run: |
          psql -v ON_ERROR_STOP=1 -At -c "
            DO \$\$
            DECLARE missing text;
            BEGIN
              SELECT string_agg(s, ', ') INTO missing
              FROM unnest(ARRAY['evento-demo-aitickets', 'evento-demo-concierto', 'evento-demo-feria', 'evento-demo-gratis', 'evento-demo-gira', 'evento-demo-teatro']) AS s
              WHERE NOT EXISTS (SELECT 1 FROM public.events e WHERE e.slug = s);
              IF missing IS NOT NULL THEN RAISE EXCEPTION 'Faltan eventos demo: %', missing; END IF;
              IF (SELECT count(*) FROM public.event_dates d JOIN public.events e ON e.id = d.event_id WHERE e.slug = 'evento-demo-gira') <> 5 THEN
                RAISE EXCEPTION 'La gira demo debe tener 5 funciones';
              END IF;
              IF EXISTS (SELECT 1 FROM public.events WHERE slug LIKE 'evento-demo-%' AND (name ILIKE '%(evento de demostración)%' OR title ILIKE '%(evento de demostración)%')) THEN
                RAISE EXCEPTION 'Los eventos demo no deben llevar (evento de demostración) en el nombre: lo dice el banner';
              END IF;
              IF (SELECT count(DISTINCT page_settings ->> 'background') FROM public.events WHERE slug LIKE 'evento-demo-%' AND coalesce(page_settings ->> 'background', 'none') <> 'none') <> 6 THEN
                RAISE EXCEPTION 'Cada evento demo debe tener un fondo animado distinto';
              END IF;
              IF (SELECT count(DISTINCT page_settings ->> 'layout') FROM public.events WHERE slug LIKE 'evento-demo-%') <> 3 THEN
                RAISE EXCEPTION 'Los eventos demo deben mostrar los 3 diseños de página (póster, portada ancha y compacto)';
              END IF;
            END \$\$;"
      # Cada db/ci/assert-*.sql (permisos, handle_new_user, triggers, reglas de borrado). Un archivo nuevo se corre solo.
      - name: Aserciones SQL (db/ci/assert-*.sql)
        run: |
          for f in db/ci/assert-*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      # El catálogo de la base armada debe ser igual a db/catalog.snapshot.tsv (si una migración cambia el esquema,
      # npm run db:snapshot lo regenera). El mismo snapshot se compara con producción en cada deploy (plugins/db-migrate).
      - name: Catálogo de la base = db/catalog.snapshot.tsv
        run: node scripts/db-drift.mjs --check
      - name: Rechazo del transaction pooler (6543)
        run: |
          if SUPABASE_DB_URL=postgresql://u:p@localhost:6543/postgres node scripts/migrate.mjs --status; then
            echo "debió rechazar el puerto 6543"; exit 1
          fi

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Sin secretos: playwright.config.ts define el entorno del servidor (BD falsa, integraciones apagadas).
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Versión de Playwright (clave de caché)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Caché de navegadores de Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Instalar Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias del sistema para Chromium (caché)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Playwright (modo sin BD)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # E2E con base de datos REAL pero local: stack de Supabase en Docker (Postgres 15.8 + Auth + PostgREST, mismas
  # imágenes que el CLI de Supabase) con db/schema.sql + TODAS las migraciones. Registro, verificación, onboarding,
  # invitaciones al equipo y la matriz de roles × páginas del panel (tests/e2e/stack). Sin secretos: claves locales y
  # correos a un buzón en disco (MAIL_OUTBOX_DIR). Nunca contra producción (playwright.stack.config.ts lo verifica).
  e2e-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Versión de Playwright (clave de caché)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Caché de navegadores de Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Instalar Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias del sistema para Chromium (caché)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Las imágenes del stack (Postgres de Supabase pesa 3 GB) se guardan en la caché: los registros públicos limitan las
      # descargas anónimas desde los runners ("toomanyrequests"). setup.mjs descarga solo las que falten, con reintentos.
      - name: Caché de imágenes del stack
        id: stack-images
        uses: actions/cache@v4
        with:
          path: /tmp/e2e-stack-images.tar.zst
          key: e2e-stack-images-${{ hashFiles('tests/e2e/stack/docker-compose.yml') }}
      - name: Cargar imágenes desde la caché
        if: steps.stack-images.outputs.cache-hit == 'true'
        run: zstd -d -c /tmp/e2e-stack-images.tar.zst | docker load
      - name: Stack de Supabase local + esquema + migraciones
        run: node tests/e2e/stack/setup.mjs
      - name: Guardar imágenes para la caché
        if: steps.stack-images.outputs.cache-hit != 'true'
        run: |
          images=$(E2E_DB_PASSWORD=x E2E_JWT_SECRET=x docker compose -f tests/e2e/stack/docker-compose.yml config --images)
          docker save $images | zstd -T0 -3 -o /tmp/e2e-stack-images.tar.zst
      - name: Playwright con base real local
        run: npx playwright test -c playwright.stack.config.ts --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-stack
          path: |
            playwright-report-stack/
            test-results/
          retention-days: 7
      - name: Bajar el stack
        if: always()
        run: node tests/e2e/stack/setup.mjs --down
