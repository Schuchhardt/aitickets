[build]
  # npm ci: instala exactamente package-lock.json (builds reproducibles).
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # Nunca incluir .env en el bundle: las variables se configuran en Netlify (Site settings > Environment variables)
  included_files = [
    "netlify/functions/**/package.json",
    "netlify/functions/**/node_modules/**"
  ]

# Reel de respaldo (netlify/lib/reel-video.mjs): ffmpeg-static queda fuera del bundle de esbuild y su binario (Linux,
# lo baja el postinstall de npm ci en el build) se incluye a mano. Repite los included_files globales.
[functions."social-series-reel-background"]
  external_node_modules = ["ffmpeg-static"]
  included_files = [
    "netlify/functions/**/package.json",
    "netlify/functions/**/node_modules/**",
    "node_modules/ffmpeg-static/ffmpeg",
    "node_modules/ffmpeg-static/package.json",
    "node_modules/ffmpeg-static/index.js"
  ]

# Migraciones automáticas de BD (plugins/db-migrate + scripts/migrate.mjs).
# Corre en onPostBuild SOLO con CONTEXT=production: si una migración falla, el deploy no ocurre.
# Deploy previews y branch deploys nunca migran (comparten la BD de producción y son código no confiable).
# Requiere SUPABASE_DB_URL (Session pooler, puerto 5432) con scope Builds y contexto Production.
# MIGRATE_ON_BUILD=false lo desactiva; ALLOW_MISSING_DB_URL=true solo para el primer deploy.
[[plugins]]
  package = "/plugins/db-migrate"

# Recordatorios 24h antes: el schedule vive en netlify/functions/send-event-reminders (config.schedule).
# Funciones programadas y background: su configuración va en el código de cada función
# (export const config = { schedule } / sufijo -background), no aquí.

# "Continuar con Google": si Supabase Auth vuelve a la raíz (/?code=…) en vez de /auth/google/callback
# (pasa cuando el callback no está en Auth > URL Configuration > Redirect URLs y usa el Site URL), se reenvía
# el código al callback. La portada es estática: force = true para que la regla gane sobre index.html.
[[redirects]]
  from = "/"
  query = { code = ":code" }
  to = "/auth/google/callback?code=:code"
  status = 302
  force = true

# /productores era un 404 y se usa en búsquedas y en la propuesta comercial: la página de productores es /organizadores.
[[redirects]]
  from = "/productores"
  to = "/organizadores"
  status = 301
  force = true

[[redirects]]
  from = "/productores/"
  to = "/organizadores"
  status = 301
  force = true

# Netlify Image CDN (/.netlify/images): portadas de eventos redimensionadas y en AVIF/WebP (src/lib/imageCdn.js).
# Solo imágenes públicas de nuestro Storage de Supabase: nadie puede usar el CDN para transformar otras URLs.
[images]
  remote_images = ["https://bgsmqjrdryafvlyxywud\\.supabase\\.co/storage/v1/object/public/.*"]
